<svg viewBox="0 0 800 600" role="presentation" aria-hidden="true">
  <!-- 角标 -->
  <path d="M18,58 V18 H58" class="hud-bracket"/>
  <path d="M742,18 H782 V58" class="hud-bracket"/>
  <path d="M782,542 V582 H742" class="hud-bracket"/>
  <path d="M58,582 H18 V542" class="hud-bracket"/>

  <!-- 刻度 -->
  <g class="hud-tick">
    <line x1="18" y1="120" x2="18" y2="140"/>
    <line x1="18" y1="170" x2="18" y2="190"/>
    <line x1="18" y1="220" x2="18" y2="240"/>
    <line x1="782" y1="360" x2="782" y2="380"/>
    <line x1="782" y1="410" x2="782" y2="430"/>
    <line x1="782" y1="460" x2="782" y2="480"/>
  </g>

  <!-- 同心弧 -->
  <g class="hud-arc">
    <circle cx="400" cy="300" r="150"/>
    <circle cx="400" cy="300" r="196"/>
    <circle cx="400" cy="300" r="248"/>
  </g>
  <path d="M400,300 m-248,0 a248,248 0 0,1 175,-236" class="hud-arc-hot"/>
  <path d="M400,300 m196,0 a196,196 0 0,1 139,139" class="hud-arc-hot"/>

  <!-- 十字准星 -->
  <g class="hud-cross">
    <line x1="400" y1="248" x2="400" y2="272"/>
    <line x1="400" y1="328" x2="400" y2="352"/>
    <line x1="348" y1="300" x2="372" y2="300"/>
    <line x1="428" y1="300" x2="452" y2="300"/>
  </g>

  <!-- 一条斜轴 + 切角平面 -->
  <path d="M0,420 L800,300" class="hud-axis"/>

  <!-- 网格 -->
  <g class="hud-grid">
    <line x1="120" y1="200" x2="700" y2="200"/>
    <line x1="120" y1="280" x2="700" y2="280"/>
    <line x1="120" y1="360" x2="700" y2="360"/>
    <line x1="120" y1="440" x2="700" y2="440"/>
    <line x1="240" y1="140" x2="240" y2="520"/>
    <line x1="360" y1="140" x2="360" y2="520"/>
    <line x1="480" y1="140" x2="480" y2="520"/>
    <line x1="600" y1="140" x2="600" y2="520"/>
  </g>
</svg>
