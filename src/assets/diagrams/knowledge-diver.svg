<svg class="diagram-arch" viewBox="0 0 800 500" role="img" aria-label="KnowledgeDiver 知识卡片流水线、质量闭环与本地优先形态示意">
  <defs>
    <pattern id="dg-grid-kd" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E6EC"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dg-grid-kd)"/>

  <text x="24" y="24" class="dg-label">KNOWLEDGE DIVER</text>
  <text x="24" y="52" class="dg-title">KNOWLEDGE PIPELINE</text>
  <rect x="24" y="60" width="44" height="3" class="dg-accent-fill"/>

  <text x="776" y="24" class="dg-mono" text-anchor="end">本地优先 · 卡片 / 嵌入 / 索引在本机</text>
  <text x="776" y="42" class="dg-mono" text-anchor="end">搜索与抓取不需要任何 API key</text>

  <path d="M24,74 H232 L240,82 V164 H24 Z" class="dg-node"/>
  <text x="38" y="98" class="dg-sub">关键词 / 文档</text>
  <text x="38" y="118" class="dg-mono">txt / md / pdf / docx</text>
  <text x="38" y="136" class="dg-mono">拆根卡 / 章节卡 / 细节卡</text>
  <text x="38" y="154" class="dg-mono">来源全文随卡片保存</text>

  <path d="M264,74 H520 L528,82 V164 H264 Z" class="dg-node"/>
  <text x="278" y="98" class="dg-sub">免 API key 搜索</text>
  <text x="278" y="118" class="dg-mono">Bing · AnySearch · Exa-MCP</text>
  <text x="278" y="136" class="dg-mono">DuckDuckGo · SearXNG</text>
  <text x="278" y="154" class="dg-mono">结果与查询无关则换下一个</text>

  <path d="M552,74 H768 L776,82 V164 H552 Z" class="dg-node"/>
  <text x="566" y="98" class="dg-sub">抓取正文</text>
  <text x="566" y="118" class="dg-mono">crawl4ai / Playwright</text>
  <text x="566" y="136" class="dg-mono">→ trafilatura → HTTP + BS4</text>
  <text x="566" y="154" class="dg-mono">浏览器渲染优先 · 失败降级</text>

  <line x1="240" y1="119" x2="264" y2="119" class="dg-hair"/>
  <line x1="528" y1="119" x2="552" y2="119" class="dg-hair"/>

  <line x1="396" y1="164" x2="396" y2="170" class="dg-hair"/>
  <line x1="132" y1="170" x2="664" y2="170" class="dg-hair"/>
  <line x1="208" y1="170" x2="208" y2="178" class="dg-hair"/>
  <line x1="592" y1="170" x2="592" y2="178" class="dg-hair"/>

  <path d="M24,178 H384 L392,186 V268 H24 Z" class="dg-node"/>
  <text x="38" y="202" class="dg-sub">LLM 写卡片</text>
  <text x="38" y="222" class="dg-mono">依据网页原文 · 非网页摘要</text>
  <text x="38" y="240" class="dg-mono">parent_id 卡片树 + 双向链接</text>
  <text x="38" y="258" class="dg-mono">backlinks 对称维护</text>

  <path d="M408,178 H768 L776,186 V268 H408 Z" class="dg-node dg-hot"/>
  <text x="422" y="202" class="dg-sub">本地嵌入向量索引</text>
  <text x="422" y="222" class="dg-mono">bge-small-zh-v1.5 · 512 维</text>
  <text x="422" y="240" class="dg-mono">sqlite-vec cosine · 语义搜索</text>
  <text x="422" y="258" class="dg-mono">新卡片自动建索引 · 启动补齐</text>

  <line x1="396" y1="268" x2="396" y2="275" class="dg-hair"/>
  <line x1="208" y1="275" x2="592" y2="275" class="dg-hair"/>
  <line x1="208" y1="275" x2="208" y2="282" class="dg-hair"/>
  <line x1="592" y1="275" x2="592" y2="282" class="dg-hair"/>

  <path d="M24,282 H384 L392,290 V370 H24 Z" class="dg-node"/>
  <text x="38" y="306" class="dg-sub">质量与缺口分析</text>
  <text x="38" y="326" class="dg-mono">四维评分：结构 / 图论 / 语义 / 置信度</text>
  <text x="38" y="344" class="dg-mono">gap 分布直方图 · 维度热图</text>
  <text x="38" y="362" class="dg-mono">HDBSCAN 聚类 → 簇级健康度</text>

  <path d="M408,282 H768 L776,290 V370 H408 Z" class="dg-node dg-hot"/>
  <text x="422" y="306" class="dg-sub">Agent /loop 补缺口</text>
  <text x="422" y="326" class="dg-mono">ReAct · 13 工具：读 / 处方 / 写</text>
  <text x="422" y="344" class="dg-mono">持续处理评分最低的卡片与簇</text>
  <text x="422" y="362" class="dg-mono">后台运行 · 写层连续失败熔断</text>

  <line x1="776" y1="326" x2="788" y2="326" class="dg-hair"/>
  <line x1="788" y1="326" x2="788" y2="66" class="dg-hair"/>
  <line x1="788" y1="66" x2="396" y2="66" class="dg-hair"/>
  <line x1="396" y1="66" x2="396" y2="74" class="dg-hair"/>
  <text x="430" y="62" class="dg-label">Agent 回补 → 新收集任务</text>

  <path d="M24,384 H768 L776,392 V478 H24 Z" class="dg-panel-strong"/>
  <text x="38" y="408" class="dg-sub">运行形态 · 本地优先</text>
  <text x="38" y="428" class="dg-mono">Python 3.10+ · FastAPI 后端</text>
  <text x="38" y="446" class="dg-mono">React 18 + TypeScript + Vite 前端</text>
  <text x="38" y="464" class="dg-mono">Node 18+ · 完整安装约 2.8 GB</text>

  <line x1="398" y1="396" x2="398" y2="470" class="dg-hair"/>

  <text x="412" y="408" class="dg-sub">数据落点</text>
  <text x="412" y="428" class="dg-mono">data/knowledgediver.db</text>
  <text x="412" y="446" class="dg-mono">cards/{user}/{session}/session.db</text>
  <text x="412" y="464" class="dg-mono">models/bge-small-zh-v1.5 · 约 92 MB</text>

  <text x="24" y="492" class="dg-mono">关键词 → 搜索 → 抓取 → 卡片树 → 向量索引 → 语义搜索 · Agent 闭环补缺口</text>
</svg>
