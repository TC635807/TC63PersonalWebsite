<svg class="diagram-arch" viewBox="0 0 800 500" role="img" aria-label="vlm-admittance 的慢环决策与快环控制流程示意">
  <defs>
    <pattern id="dg-grid-vlm" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E6EC"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dg-grid-vlm)"/>

  <text x="24" y="24" class="dg-label">VLM ADMITTANCE</text>
  <text x="24" y="52" class="dg-title">DECIDE → PLAN → COMPLY</text>
  <rect x="24" y="60" width="44" height="3" class="dg-accent-fill"/>

  <text x="776" y="24" class="dg-mono" text-anchor="end">MuJoCo 3.12 · UR5e + Robotiq 2F85</text>
  <text x="776" y="42" class="dg-mono" text-anchor="end">慢环 0.5~2 Hz · 快环 500 Hz</text>

  <path d="M24,74 H252 L260,82 V164 H24 Z" class="dg-node dg-hot"/>
  <text x="38" y="98" class="dg-sub">慢环 · agent/</text>
  <text x="38" y="118" class="dg-mono">overview / wrist / top 三相机</text>
  <text x="38" y="136" class="dg-mono">场景 JSON：id / 颜色 / 类别</text>
  <text x="38" y="154" class="dg-mono">不含物体真值位姿</text>

  <path d="M276,74 H524 L532,82 V164 H276 Z" class="dg-node"/>
  <text x="290" y="98" class="dg-sub">VLM · function calling</text>
  <text x="290" y="118" class="dg-mono">任意 OpenAI 兼容多模态端点</text>
  <text x="290" y="136" class="dg-mono">tools + tool_choice = auto</text>
  <text x="290" y="154" class="dg-mono">无 key 时同路径走 MockVLM</text>

  <path d="M548,74 H776 L784,82 V164 H548 Z" class="dg-node"/>
  <text x="562" y="98" class="dg-sub">SkillCall · 校验</text>
  <text x="562" y="118" class="dg-mono">白名单 → 类型/范围 → 场景一致性</text>
  <text x="562" y="136" class="dg-mono">非法调用回灌给模型自我纠正</text>
  <text x="562" y="154" class="dg-mono">技能 14 个 · 参数冗余被纠正</text>

  <line x1="260" y1="119" x2="276" y2="119" class="dg-hair"/>
  <line x1="532" y1="119" x2="548" y2="119" class="dg-hair"/>

  <line x1="666" y1="164" x2="666" y2="176" class="dg-hair"/>
  <line x1="204" y1="176" x2="666" y2="176" class="dg-hair"/>
  <line x1="204" y1="176" x2="204" y2="188" class="dg-hair"/>
  <line x1="592" y1="176" x2="592" y2="188" class="dg-hair"/>

  <path d="M24,188 H384 L392,196 V278 H24 Z" class="dg-node"/>
  <text x="38" y="212" class="dg-sub">skills/ 技能库</text>
  <text x="38" y="232" class="dg-mono">确定性动作序列：pick / place / push / home</text>
  <text x="38" y="250" class="dg-mono">自由段刚性档 · 接触段柔顺档</text>
  <text x="38" y="268" class="dg-mono">失败给结构化 error_code 供重试</text>

  <path d="M408,188 H776 L784,196 V278 H408 Z" class="dg-node"/>
  <text x="422" y="212" class="dg-sub">planning/ RRT-Connect</text>
  <text x="422" y="232" class="dg-mono">私有 MjData 碰撞检测（不动 env.data）</text>
  <text x="422" y="250" class="dg-mono">双树 EXTEND / CONNECT · shortcut · densify</text>
  <text x="422" y="268" class="dg-mono">plan_pose 误差 0.0000 m · 绕障 0.12 s</text>

  <line x1="384" y1="233" x2="408" y2="233" class="dg-hair"/>
  <line x1="204" y1="278" x2="204" y2="298" class="dg-hair"/>
  <line x1="592" y1="278" x2="592" y2="298" class="dg-hair"/>

  <path d="M24,298 H384 L392,306 V388 H24 Z" class="dg-node"/>
  <text x="38" y="322" class="dg-sub">control/ 笛卡尔轨迹</text>
  <text x="38" y="342" class="dg-mono">min-jerk 10s³−15s⁴+6s⁵ + slerp 姿态</text>
  <text x="38" y="360" class="dg-mono">接触段参考限速 v_max · 单步 v_max·dt</text>
  <text x="38" y="378" class="dg-mono">move_to_pose 终态 0.98 mm</text>

  <path d="M408,298 H776 L784,306 V388 H408 Z" class="dg-node dg-hot"/>
  <text x="422" y="322" class="dg-sub">control/ 导纳 + DLS IK</text>
  <text x="422" y="342" class="dg-mono">Mẍ + Dẋ + K(x−x_ref) = −f_ext</text>
  <text x="422" y="360" class="dg-mono">dq = Jᵀ(JJᵀ+λ²I)⁻¹e + 零空间回中</text>
  <text x="422" y="378" class="dg-mono">IK 往返 0.38 mm / 4.9e-4 rad</text>

  <path d="M24,402 H768 L776,410 V478 H24 Z" class="dg-panel-strong"/>
  <text x="38" y="426" class="dg-sub">全链路验收 · 2026-10-12</text>
  <text x="38" y="446" class="dg-mono">9/10 通过（唯一红为既有导纳让位方向缺陷）</text>
  <text x="38" y="464" class="dg-mono">box_red 抬升 119.3 mm → 托盘落点偏差 0.5 mm</text>

  <line x1="400" y1="414" x2="400" y2="470" class="dg-hair"/>

  <text x="414" y="426" class="dg-sub">真实端点</text>
  <text x="414" y="446" class="dg-mono">三条中文指令均成功 · 9.1~11.9 s</text>
  <text x="414" y="464" class="dg-mono">不训练 VLA · 无数据集 · 无 key 也能离线跑</text>
</svg>
