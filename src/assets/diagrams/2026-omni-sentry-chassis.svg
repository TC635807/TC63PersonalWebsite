<svg class="diagram-arch" viewBox="0 0 800 500" role="img" aria-label="2026 全向哨兵底盘板固件架构图">
  <defs>
    <pattern id="dg-grid-chassis-arch" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E6EC"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dg-grid-chassis-arch)"/>
  <text x="24" y="30" class="dg-label">CHASSIS BOARD · 下 C 板</text>
  <text x="24" y="62" class="dg-title">CHASSIS FIRMWARE</text>
  <rect x="24" y="72" width="44" height="3" class="dg-accent-fill"/>
  <text x="776" y="30" class="dg-mono" text-anchor="end">STM32F407IGHx · FreeRTOS / CMSIS-OS v1</text>
  <text x="776" y="48" class="dg-mono" text-anchor="end">3 已注册（imu/TestTask 注释）· 四轮 500 Hz</text>
  <text x="24" y="92" class="dg-label">任务调度 · 与云台板共用 TaskBase；imuTask 启动语句被注释</text>
  <path d="M24,100 H254 L266,112 V152 H24 Z" class="dg-node dg-hot"/>
  <text x="34" y="121" class="dg-sub">ChassisTask</text>
  <text x="34" y="139" class="dg-mono">栈 1024 · osDelay(2) → 2 ms</text>
  <path d="M279,100 H509 L521,112 V152 H279 Z" class="dg-node dg-hot"/>
  <text x="289" y="121" class="dg-sub">ControlCenterTask</text>
  <text x="289" y="139" class="dg-mono">栈 512 · osDelay(2) → 2 ms</text>
  <path d="M534,100 H764 L776,112 V152 H534 Z" class="dg-node"/>
  <text x="544" y="121" class="dg-sub">UsbConnectTask</text>
  <text x="544" y="139" class="dg-mono">栈 1024 · osDelay(10) → 10 ms</text>
  <path d="M24,158 H254 L266,170 V210 H24 Z" class="dg-node"/>
  <text x="34" y="179" class="dg-sub">imuTask</text>
  <text x="34" y="197" class="dg-mono">栈 1024 · 启动被注释（未启用）</text>
  <path d="M279,158 H509 L521,170 V210 H279 Z" class="dg-node"/>
  <text x="289" y="179" class="dg-sub">TestTask</text>
  <text x="289" y="197" class="dg-mono">栈 0 · 空 for(;;)（未注册）</text>
  <path d="M534,158 H764 L776,170 V210 H534 Z" class="dg-node"/>
  <text x="544" y="179" class="dg-sub">TaskBase</text>
  <text x="544" y="197" class="dg-mono">start() → osThreadCreate</text>
  <text x="24" y="226" class="dg-label">数据流 · ControlCenterTask 解算 → ChassisTask 闭环 → 功率限制 → CAN2 0x200</text>
  <path d="M24,234 H150 L162,246 V289 H24 Z" class="dg-node"/>
  <text x="34" y="255" class="dg-sub">指令源</text>
  <text x="34" y="272" class="dg-mono">DBUS / USB cmd</text>
  <line x1="164" y1="262" x2="169" y2="262" class="dg-hair"/>
  <path d="M169,258 L176,262 L169,266 Z" class="dg-accent-fill"/>
  <path d="M177,234 H303 L315,246 V289 H177 Z" class="dg-node"/>
  <text x="187" y="255" class="dg-sub">运动学解算</text>
  <text x="187" y="272" class="dg-mono">vx,vy,ω → 四轮</text>
  <line x1="317" y1="262" x2="322" y2="262" class="dg-hair"/>
  <path d="M322,258 L329,262 L322,266 Z" class="dg-accent-fill"/>
  <path d="M330,234 H456 L468,246 V289 H330 Z" class="dg-node"/>
  <text x="340" y="255" class="dg-sub">斜坡 + SpeedPID</text>
  <text x="340" y="272" class="dg-mono">ramp 350 · KP4</text>
  <line x1="470" y1="262" x2="475" y2="262" class="dg-hair"/>
  <path d="M475,258 L482,262 L475,266 Z" class="dg-accent-fill"/>
  <path d="M483,234 H609 L621,246 V289 H483 Z" class="dg-node"/>
  <text x="493" y="255" class="dg-sub">功率限制</text>
  <text x="493" y="272" class="dg-mono">P ≤ 95 W</text>
  <line x1="623" y1="262" x2="628" y2="262" class="dg-hair"/>
  <path d="M628,258 L635,262 L628,266 Z" class="dg-accent-fill"/>
  <path d="M636,234 H762 L774,246 V289 H636 Z" class="dg-node"/>
  <text x="646" y="255" class="dg-sub">CAN2 0x200</text>
  <text x="646" y="272" class="dg-mono">3508 ×4 ID1–4</text>
  <path d="M24,296 H284 L296,308 V444 H24 Z" class="dg-panel-strong"/>
  <text x="36" y="314" class="dg-label">运动学 · 全向四轮</text>
  <text x="36" y="332" class="dg-mono">Δ = (Init − yaw_motor_5)×2π/8192</text>
  <text x="36" y="347" class="dg-mono">vx' = vx·cosΔ − vy·sinΔ</text>
  <text x="36" y="362" class="dg-mono">vy' = vx·sinΔ + vy·cosΔ</text>
  <text x="36" y="377" class="dg-mono">M1 右前 = vx' − vy' + ω</text>
  <text x="36" y="392" class="dg-mono">M2 左前 = −vx' − vy' + ω</text>
  <text x="36" y="407" class="dg-mono">M3 左后 = −vx' + vy' + ω</text>
  <text x="36" y="422" class="dg-mono">M4 右后 = vx' + vy' + ω</text>
  <text x="36" y="437" class="dg-mono">RC_follow：ω ← follow PID(800)</text>
  <path d="M304,296 H524 L536,308 V444 H304 Z" class="dg-panel-strong"/>
  <text x="316" y="314" class="dg-label">功率控制 · 裁判系统</text>
  <text x="316" y="332" class="dg-mono">P = k1·w + k2·w² + a·T² + c</text>
  <text x="316" y="347" class="dg-mono">k1 1.99e-6 · k2 1.45e-7</text>
  <text x="316" y="362" class="dg-mono">a 1.23e-7 · c 4.081</text>
  <text x="316" y="377" class="dg-mono">ΣP &gt; 95 W → scale = P/ΣP</text>
  <text x="316" y="392" class="dg-mono">解 aT² + bT + c = 0 求 T'</text>
  <text x="316" y="407" class="dg-mono">T' 限幅 ±16000</text>
  <text x="316" y="422" class="dg-mono">USART6 裁判 0x0202/0x0207</text>
  <text x="316" y="437" class="dg-mono">热量 · 缓冲能量 · 功率上限</text>
  <path d="M544,296 H764 L776,308 V444 H544 Z" class="dg-panel-strong"/>
  <text x="556" y="314" class="dg-label">总线 · 模式 · CAN1</text>
  <text x="556" y="332" class="dg-mono">ControlTarget ⊆ Message_Bus</text>
  <text x="556" y="347" class="dg-mono">chassis_vx/vy/wz（麦轮）</text>
  <text x="556" y="362" class="dg-mono">USB 0x5A·CRC8/16·id 0x01</text>
  <text x="556" y="377" class="dg-mono">control_mode RC/RC_follow/AI</text>
  <text x="556" y="392" class="dg-mono">s1=1/2/3；急停未接入</text>
  <text x="556" y="407" class="dg-mono">MODE_AI：轮速直接取 vx/vy</text>
  <text x="556" y="422" class="dg-mono">CAN1 板间 0x301 RC / 0x302</text>
  <text x="556" y="437" class="dg-mono">CAN1 读 yaw_motor_5 (0x205)</text>
  <text x="24" y="466" class="dg-mono">周期取自各 Task::run() 中 osDelay；栈大小为 start(name, stack, prio) 实参</text>
  <text x="24" y="484" class="dg-mono">出处：Task/Src/ChassisTask.cpp · ControlCenterTask.cpp · motor_power_control.c · bsp_can.cpp</text>
</svg>
