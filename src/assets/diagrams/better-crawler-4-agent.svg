<svg class="diagram-arch" viewBox="0 0 800 500" role="img" aria-label="better-crawler 三层抓取回退、实测对照与防护能力示意">
  <defs>
    <pattern id="dg-grid-tiers" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E6EC"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dg-grid-tiers)"/>

  <text x="24" y="24" class="dg-label">CRAWLER</text>
  <text x="24" y="52" class="dg-title">TIER FALLBACK</text>
  <rect x="24" y="60" width="44" height="3" class="dg-accent-fill"/>

  <text x="776" y="24" class="dg-mono" text-anchor="end">better-crawler-4-agent</text>
  <text x="776" y="42" class="dg-mono" text-anchor="end">标准 stdio MCP server</text>

  <path d="M24,74 H232 L240,82 V164 H24 Z" class="dg-node dg-hot"/>
  <text x="38" y="98" class="dg-sub">tier 1 · browser</text>
  <text x="38" y="118" class="dg-mono">真实 Chromium 渲染</text>
  <text x="38" y="136" class="dg-mono">UA / Sec-Ch-Ua 全套一致</text>
  <text x="38" y="154" class="dg-mono">共享单例 · 崩溃自动重建</text>

  <path d="M264,74 H520 L528,82 V164 H264 Z" class="dg-node"/>
  <text x="278" y="98" class="dg-sub">tier 2 · trafilatura</text>
  <text x="278" y="118" class="dg-mono">静态快路径 · 约 1 s</text>
  <text x="278" y="136" class="dg-mono">反爬域名 10 分钟内跳过</text>
  <text x="278" y="154" class="dg-mono">浏览器不可用则降级</text>

  <path d="M552,74 H768 L776,82 V164 H552 Z" class="dg-node"/>
  <text x="566" y="98" class="dg-sub">tier 3 · httpx</text>
  <text x="566" y="118" class="dg-mono">完整浏览器指纹兜底</text>
  <text x="566" y="136" class="dg-mono">补 Sec-Ch-Ua / HTTP2</text>
  <text x="566" y="154" class="dg-mono">解决 CSDN 等站 521</text>

  <line x1="240" y1="119" x2="264" y2="119" class="dg-hair"/>
  <line x1="528" y1="119" x2="552" y2="119" class="dg-hair"/>

  <line x1="396" y1="164" x2="396" y2="178" class="dg-hair"/>

  <path d="M24,178 H768 L776,186 V256 H24 Z" class="dg-node"/>
  <text x="38" y="202" class="dg-sub">成功率对照 · 同一组 6 个 URL</text>
  <text x="38" y="222" class="dg-mono">有浏览器 6/6 = 100%</text>
  <text x="38" y="240" class="dg-mono">仅静态路径 5/6 = 83%</text>

  <line x1="398" y1="190" x2="398" y2="248" class="dg-hair"/>

  <text x="412" y="202" class="dg-sub">正文字符数（有浏览器 vs 仅静态）</text>
  <text x="412" y="222" class="dg-mono">知乎 27,069 vs 失败 · CSDN 57,218 vs 13,845</text>
  <text x="412" y="240" class="dg-mono">博客园 15,360 vs 4,627（−70%）</text>

  <line x1="396" y1="256" x2="396" y2="282" class="dg-hair"/>

  <text x="24" y="276" class="dg-label">防护与可观测</text>
  <line x1="24" y1="282" x2="776" y2="282" class="dg-hair"/>
  <line x1="113" y1="282" x2="113" y2="292" class="dg-hair"/>
  <line x1="304" y1="282" x2="304" y2="292" class="dg-hair"/>
  <line x1="495" y1="282" x2="495" y2="292" class="dg-hair"/>
  <line x1="686" y1="282" x2="686" y2="292" class="dg-hair"/>

  <path d="M24,292 H194 L202,300 V364 H24 Z" class="dg-node"/>
  <text x="37" y="316" class="dg-sub">字体蜜罐检测</text>
  <text x="37" y="336" class="dg-mono">知乎 mmmlli 重复串</text>
  <text x="37" y="354" class="dg-mono">按长度取正文会误选</text>

  <path d="M215,292 H385 L393,300 V364 H215 Z" class="dg-node"/>
  <text x="228" y="316" class="dg-sub">假成功检测</text>
  <text x="228" y="336" class="dg-mono">HTTP 200 实为错误页</text>
  <text x="228" y="354" class="dg-mono">登录墙 / 文章已删除</text>

  <path d="M406,292 H576 L584,300 V364 H406 Z" class="dg-node"/>
  <text x="419" y="316" class="dg-sub">SSRF 防护</text>
  <text x="419" y="336" class="dg-mono">默认拒回环 / 内网</text>
  <text x="419" y="354" class="dg-mono">拒 169.254.169.254</text>

  <path d="M597,292 H767 L775,300 V364 H597 Z" class="dg-node"/>
  <text x="610" y="316" class="dg-sub">每层诊断</text>
  <text x="610" y="336" class="dg-mono">status / tier</text>
  <text x="610" y="354" class="dg-mono">warning / attempts</text>

  <path d="M24,378 H768 L776,386 V468 H24 Z" class="dg-panel-strong"/>
  <text x="38" y="402" class="dg-sub">形态 · 标准 stdio MCP server，不绑定客户端</text>
  <text x="38" y="422" class="dg-mono">Claude Code / Cursor / Windsurf / Cline / Codex / ZCode / dsh plugin</text>
  <text x="38" y="440" class="dg-mono">工具：fetch_url · fetch_urls · crawler_status（并发最多 20 条）</text>
  <text x="38" y="458" class="dg-mono">单元测试 34 项 · 端到端自检 15 项 · Playwright 1.61.0 锁定</text>

  <text x="24" y="492" class="dg-mono">URL → 文本 · 只做抓取不做搜索 · 遵守 robots.txt · 不用于高频批量抓取</text>
</svg>
