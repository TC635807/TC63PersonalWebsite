  <text x="416" y="272" class="dg-mono">yaw 80/2/2→20/0/0.02</text>
  <line x1="585" y1="262" x2="589" y2="262" class="dg-hair"/>
  <path d="M589,258 L596,262 L589,266 Z" class="dg-accent-fill"/>
  <path d="M597,234 H762 L774,246 V289 H597 Z" class="dg-node"/>
