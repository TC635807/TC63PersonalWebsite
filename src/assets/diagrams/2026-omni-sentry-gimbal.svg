  <text x="36" y="314" class="dg-label">闭环 · 限幅</text>
  <text x="36" y="332" class="dg-mono">pitch 2.7/2/0.06→40/1/0</text>
  <text x="36" y="347" class="dg-mono">dt 0.001 s · 跨零/回绕</text>
  <text x="36" y="362" class="dg-mono">pitch −17° … +20° 限幅</text>
  <text x="36" y="377" class="dg-mono">摩擦轮 ×2 + 差值 PID</text>
  <text x="36" y="392" class="dg-mono">拨弹：角度→速度→反转</text>
  <text x="36" y="407" class="dg-mono">堵转 500 ms · 反转 100 ms</text>
  <text x="36" y="422" class="dg-mono">hot_17mm ≤ 200 才拨弹</text>
  <text x="36" y="437" class="dg-mono">yaw 电流限幅 ±50000</text>
  <path d="M242,296 H502 L514,308 V444 H242 Z" class="dg-panel-strong"/>
  <text x="254" y="314" class="dg-label">视觉协议 · 通信链路</text>
  <text x="254" y="332" class="dg-mono">视觉 43B：q[4]+yaw/pitch+弹速+弹量</text>
  <text x="254" y="347" class="dg-mono">视觉 29B：yaw/pitch+一/二阶导</text>
  <text x="254" y="362" class="dg-mono">CRC16 小端 · USB CDC 虚拟串口</text>
  <text x="254" y="377" class="dg-mono">DBUS 18B · USART3 DMA</text>
  <text x="254" y="392" class="dg-mono">CAN1 0x1FF yaw · LK 0x141</text>
  <text x="254" y="407" class="dg-mono">CAN2 0x200 摩擦轮 ID1/ID2</text>
  <text x="254" y="422" class="dg-mono">板间 0x301 RC / 0x302 yaw</text>
  <text x="254" y="437" class="dg-mono">0x303/0x309 弹速热量←底盘</text>
  <path d="M522,296 H764 L776,308 V444 H522 Z" class="dg-panel-strong"/>
  <text x="534" y="314" class="dg-label">总线 · 控制模式</text>
  <text x="534" y="332" class="dg-mono">ControlTarget ← ControlCenter</text>
  <text x="534" y="347" class="dg-mono">chassis_vx/vy/wz ← 0x309 wz</text>
  <text x="534" y="362" class="dg-mono">gimbal_yaw_angle(+single)/pitch</text>
  <text x="534" y="377" class="dg-mono">friction_ready · feeder_ready</text>
  <text x="534" y="392" class="dg-mono">control_mode RC/RC_follow/AI</text>
  <text x="534" y="407" class="dg-mono">s1=1 / 2 / 3 档位切换</text>
  <text x="534" y="422" class="dg-mono">yaw 前馈 −chassis_wz×1.8</text>
  <text x="534" y="437" class="dg-mono">emergency_stop 已定义·未接入</text>
  <text x="24" y="466" class="dg-mono">周期取自各 Task::run() 中 osDelay / DWT_Delay_ms；栈大小为 start(name, stack, prio) 实参</text>
  <text x="24" y="484" class="dg-mono">出处：Task/Src/*.cpp · Message_Bus/message_bus.h · BSP/Src/bsp_can.cpp · Communication/Inc/usb_protocol.h</text>
